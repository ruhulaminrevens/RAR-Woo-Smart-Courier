name: Normalize plugin source

on:
  push:
    paths:
      - ".github/workflows/sync-plugin-source.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild repository source from stable installable package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rwsc-build
          mkdir -p .rwsc-build
          unzip -q releases/rar-woo-smart-courier-v1.3.0.zip -d .rwsc-build
          SRC=".rwsc-build/rar-woo-smart-courier/rar-woo-smart-courier.php"
          test -f "$SRC"

          python3 - <<'PY'
          from pathlib import Path

          src = Path(".rwsc-build/rar-woo-smart-courier/rar-woo-smart-courier.php").read_text(encoding="utf-8")
          marker = "if ( ! defined( 'ABSPATH' ) )"
          start = src.index(marker)
          tail = "RAR_Woo_Smart_Courier::instance();"
          before, sep, after = src.rpartition(tail)
          if not sep:
              raise SystemExit("Stable package bootstrap marker not found.")

          class_source = "<?php\n" + before[start:].rstrip() + "\n"

          bootstrap = """<?php
/**
 * Plugin Name: RAR Woo Smart Courier
 * Plugin URI:  https://github.com/ruhulaminrevens/RAR-Woo-Smart-Courier
 * Description: Smart multi-courier shipping selector for WooCommerce with configurable zone/weight pricing, ETA-aware recommendation, native free-shipping presentation, custom courier support, and order metadata.
 * Version:     1.3.0
 * Author:      Ruhul Amin
 * Author URI:  https://github.com/ruhulaminrevens
 * Text Domain: rar-woo-smart-courier
 * Requires at least: 6.5
 * Requires PHP: 8.0
 * WC requires at least: 8.0
 */

if ( ! defined( 'ABSPATH' ) ) {
    exit;
}

define( 'RWSC_VERSION', '1.3.0' );
define( 'RWSC_FILE', __FILE__ );
define( 'RWSC_DIR', plugin_dir_path( __FILE__ ) );

require_once RWSC_DIR . 'includes/class-rwsc-plugin.php';

RAR_Woo_Smart_Courier::instance();
"""

          Path("includes").mkdir(exist_ok=True)
          Path("includes/class-rwsc-plugin.php").write_text(class_source, encoding="utf-8")
          Path("rar-woo-smart-courier.php").write_text(bootstrap, encoding="utf-8")

          for old in ("includes/class-rwsc-engine.php", "includes/class-rwsc-admin.php"):
              p = Path(old)
              if p.exists():
                  p.unlink()
          PY

          php -l rar-woo-smart-courier.php
          php -l includes/class-rwsc-plugin.php
          rm -rf .rwsc-build

      - name: Commit normalized source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rar-woo-smart-courier.php includes
          if git diff --cached --quiet; then
            echo "Source tree already matches the stable package."
            exit 0
          fi
          git commit -m "fix: align source tree with stable v1.3.0 package"
          git push
